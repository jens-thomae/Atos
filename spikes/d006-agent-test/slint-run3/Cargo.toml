[package]
name = "d006-slint"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

# Outside the main workspace (spikes are excluded there).
[workspace]

[dependencies]
slint = "=1.18.1"
# Already in the tree through slint (i-slint-core); used for local time (brief §3).
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build = "=1.18.1"
