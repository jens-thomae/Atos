[package]
name = "d006-slint"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

# Outside the main workspace (spikes are excluded there).
[workspace]

[dependencies]
# unstable-winit-030: only for the software variant's first-frame hook (window event filter).
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
# Already in the tree through slint (i-slint-core); used for local time (brief §3).
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build = "=1.18.1"
