# Lima template for the Atos dev VM (card #16, docs/dev-environment.md).
# Do not start it directly: `tools/dev-vm/vm up` adds the repository mount.
minimumLimaVersion: 2.0.0

# Ubuntu 24.04 matches the CI runner (ubuntu-24.04). Not a D-008 choice.
# Pinned by URL and digest, no fallback: bumping it is a deliberate edit.
# Digest from the release's SHA256SUMS.
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64
    digest: "sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55"

vmType: vz
mountType: virtiofs
cpus: 4
memory: 8GiB
disk: 100GiB

containerd:
  system: false
  user: false

# Nothing in the VM is reachable from the host's ports.
portForwards:
  - guestIP: 0.0.0.0 # any guest address
    guestPortRange: [1, 65535]
    proto: any
    ignore: true

provision:
  # Lima reruns provisioning on every boot; apt-get install is idempotent.
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      # build-essential, pkg-config: crates with C dependencies.
      # weston: headless Wayland compositor (pixman software renderer) plus
      #   weston-simple-shm and weston-screenshooter.
      # at-spi2-core, gir1.2-atspi-2.0, python3-gi: AT-SPI bus and the tree dump in smoke.sh.
      # zenity: a small GTK app that exposes an accessibility tree.
      # sway, wtype, wl-clipboard, grim: headless compositor with virtual-keyboard support, key
      #   injection, clipboard and screenshots for the D-006 measurements (tools/d006, #12).
      # libfontconfig-dev, libxkbcommon-dev: build dependencies of the D-006 prototypes.
      # bc: build-time arithmetic in tools/d006/m9-build.sh.
      # libpipewire-0.3-dev, clang: the shell's PipeWire client (components/c3-shell, #65; bindgen).
      # podman, qemu-system-arm, qemu-efi-aarch64 (AAVMF), fsverity, sbsigntool: build, boot and
      #   tamper-test the sealed base image (tools/dev-vm/sealed.sh, #54).
      apt-get update
      apt-get install -y --no-install-recommends \
        build-essential pkg-config curl ca-certificates git \
        weston at-spi2-core gir1.2-atspi-2.0 python3-gi zenity \
        sway wtype wl-clipboard grim libfontconfig-dev libxkbcommon-dev bc libpipewire-0.3-dev clang \
        podman qemu-system-arm qemu-efi-aarch64 fsverity sbsigntool
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Pinned rustup-init; sha256 from its .sha256 file on static.rust-lang.org.
      # The toolchain itself comes from rust-toolchain.toml, see `vm up`.
      RUSTUP_VERSION=1.29.3
      RUSTUP_SHA256=9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282
      if [ ! -x ~/.cargo/bin/rustup ]; then
        curl -fsSL -o /tmp/rustup-init \
          "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/aarch64-unknown-linux-gnu/rustup-init"
        echo "$RUSTUP_SHA256  /tmp/rustup-init" | sha256sum --check
        chmod +x /tmp/rustup-init
        /tmp/rustup-init -y --profile minimal --default-toolchain none
        rm /tmp/rustup-init
      fi
      # rustup stays at the pinned version.
      ~/.cargo/bin/rustup set auto-self-update disable
