# D-006 option B (docs/reference-runner.md, "GPU measurements"): sway on a real display, as the owner,
# with the measurement inside it. From the unpacked workflow bundle:  cd ~/d006 && sway -c tools/d006/sway-drm.conf
# The output keeps its native mode. G4 is defined at 60 Hz: if the `output:` line of environment.txt
# does not say 60Hz, add e.g. `output * mode 1920x1080@60Hz` here (summarize.py also warns). Results: ~/d006/out-gpu (log: out-gpu.log).
for_window [title="^Files$"] floating enable
# One exec line: two would start at once, and `swaymsg exit` would quit sway before the run.
exec sh -c 'D006_COMPOSITOR=existing D006_RENDERER=gles2 tools/d006/measure.sh bin out-gpu >out-gpu.log 2>&1; swaymsg exit'
