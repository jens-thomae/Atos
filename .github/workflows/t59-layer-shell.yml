# Spike #59: Slint on wlr-layer-shell with an AccessKit tree (spikes/c4-layer-shell/).
# Hosted run (headless sway, software rendering): on pull requests that change the spike, and with
# the label `t59-measure`. Reference NUC on the GPU: only with the label `t59-nuc` (or
# `gh workflow run t59-layer-shell.yml -f nuc=true` once this file is on main). The NUC job runs only on
# the `labeled` event (and dispatch): later pushes do not re-measure, so NUC numbers belong to the
# commit that was labeled. Remove and re-add the label to measure a new commit.
# Write-up: docs/components/c4-toolkit/layer-shell-spike.md.
name: T-59 layer-shell spike

on:
  workflow_dispatch:
    inputs:
      nuc:
        description: Also measure on the reference NUC (GPU, about 5 min)
        type: boolean
        default: true
  pull_request:
    types: [opened, synchronize, labeled]
    paths:
      - spikes/c4-layer-shell/**
      - third_party/slint/**
      - .github/workflows/t59-layer-shell.yml

permissions: {}

# The label is part of the group, so an unrelated label cannot cancel a running NUC job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name || github.event.action || 'dispatch' }}
  cancel-in-progress: true

jobs:
  # Nothing compiles on the NUC: build here, measure there.
  build:
    # Never for pull requests from forks: their code must not reach the self-hosted runner.
    # A labeled event runs only for this workflow's own labels.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'labeled' ||
        github.event.label.name == 't59-measure' || github.event.label.name == 't59-nuc'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig-dev libxkbcommon-dev libwayland-dev libegl-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            spikes/c4-layer-shell
      - run: cargo build --release --locked -p budgets
      - name: Fetch the pinned Slint and apply the patch queue
        run: tools/slint-fork/slint-fork.sh setup
      # Not --locked: the fork's path sources replace the crates.io entries (see slint-fork.yml).
      - name: Build the spike against the fork
        working-directory: spikes/c4-layer-shell
        run: |
          cargo build --release --config ../../third_party/slint/patch.toml
          cargo tree -p slint --config ../../third_party/slint/patch.toml 2>/dev/null | head -1 | grep -F third_party/slint/src
      - name: Stage the bundle
        run: |
          mkdir -p bundle
          cp target/release/budgets spikes/c4-layer-shell/target/release/c4-layer-shell bundle/
          cp spikes/c4-layer-shell/{measure.sh,check.sh,atspi_dump.py,summarize.py} bundle/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t59-bundle
          path: bundle
          if-no-files-found: error
          retention-days: 14

  # Hosted x86_64, pixman and llvmpipe: shows the surfaces and the tree; timings are indicative only.
  measure-hosted:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t59-bundle
          path: bundle
      - run: chmod +x bundle/*
      # Same packages as docs/reference-runner.md step 7 (the NUC has them).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sway wtype grim at-spi2-core gir1.2-atspi-2.0 \
            python3-gi dbus-daemon libgl1-mesa-dri libegl1 fontconfig fonts-dejavu-core mesa-utils
      - name: Run and measure
        run: |
          bundle/measure.sh bundle/c4-layer-shell bundle/budgets results
          cat results/summary.md >>"$GITHUB_STEP_SUMMARY"
          { echo; echo '#### AT-SPI tree with the popover open'; echo '```'; cat results/atspi-2-popover.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      # The acceptance checks of #59: tree and pixels (spikes/c4-layer-shell/check.sh).
      - name: Check the AT-SPI tree and that the popover is drawn
        run: bundle/check.sh results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: t59-results-hosted
          path: results/
          if-no-files-found: warn
          retention-days: 14

  # Reference hardware on the GPU. Runs only if `build` succeeded, so the fork rule above covers it.
  measure-nuc:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.nuc ||
      github.event_name == 'pull_request' && github.event.label.name == 't59-nuc'
    runs-on: [self-hosted, nuc]
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Clean the workspace
        run: rm -rf bundle results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t59-bundle
          path: bundle
      - run: chmod +x bundle/*
      - name: Check the packages and GPU access (docs/reference-runner.md)
        run: |
          for c in sway wtype grim dbus-run-session busctl python3 eglinfo; do
            command -v "$c" >/dev/null || { echo "::error::$c is missing on the NUC (docs/reference-runner.md step 7)"; exit 1; }
          done
          python3 -c 'import gi; gi.require_version("Atspi","2.0")'
          [ -r /dev/dri/renderD128 ] && [ -w /dev/dri/renderD128 ] || { echo "::error::runner cannot open /dev/dri/renderD128 (docs/reference-runner.md, GPU access)"; exit 1; }
      - name: Run and measure (GPU)
        env:
          T59_RENDERER: gles2
          T59_OPENS: "30"
          T59_CPU_WINDOW: "60"
        run: |
          bundle/measure.sh bundle/c4-layer-shell bundle/budgets results
          cat results/summary.md >>"$GITHUB_STEP_SUMMARY"
      - name: Check the AT-SPI tree and that the popover is drawn
        run: bundle/check.sh results
      # Same rule as perf.yml: a software renderer is not a GPU measurement.
      - name: Check the renderer is the GPU
        run: |
          grep -E '^(egl|spike renderer):' results/environment.txt
          for k in 'egl' 'spike renderer'; do
            grep -q "^$k: " results/environment.txt && ! grep -Eiq "^$k:.*(llvmpipe|softpipe|none)" results/environment.txt \
              || { echo "::error::$k is not the GPU renderer"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: t59-results-nuc
          path: results/
          if-no-files-found: warn
          retention-days: 14
