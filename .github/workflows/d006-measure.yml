# D-006 spike (#12): measure both Files prototypes (docs/decisions/D-006-measurements.md).
# One command on the reference hardware: `gh workflow run d006-measure.yml -f nuc=true`
# (after this file is on main), or add the label `d006-nuc` to a pull request of this repository.
# The label `d006-measure` measures on a GitHub-hosted runner only (indicative numbers).
name: D-006 measure

on:
  workflow_dispatch:
    inputs:
      nuc:
        description: Also measure on the reference NUC (about 3 h 30 min, on the GPU)
        type: boolean
        default: true
  # Only when a label is added: later pushes never start a run, so the NUC is never reached
  # by new code without the owner adding the label again.
  pull_request:
    types: [labeled]

permissions: {}

# A newer run for the same trigger replaces an older one (one run at a time on the single NUC
# runner). The label name is part of the group, so an unrelated label (`perf`, ...) starts its own
# skipped run in its own group and cannot cancel a running `d006-nuc` job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name || 'dispatch' }}
  cancel-in-progress: true

jobs:
  # Nothing compiles on the NUC: build here, measure there.
  build:
    # Never for pull requests from forks: their code must not reach the self-hosted runner.
    # Only the label added just now starts a run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.label.name == 'd006-measure' || github.event.label.name == 'd006-nuc'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # includes the Slint fork build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            spikes/d006-iced
            spikes/d006-slint
            spikes/d006-slint -> target-fork
      - run: cargo build --release --locked -p budgets
      - run: cargo build --release --locked --manifest-path spikes/d006-slint/Cargo.toml
      # The same spike against our Slint fork (third_party/slint, as slint-fork.yml builds it), for the
      # slint-fork variants (#97, A8). Own target dir so the crates.io build above stays intact; no
      # --locked, because the path sources replace the crates.io entries in Cargo.lock (not committed).
      - name: Build the d006-slint spike against the Slint fork
        run: |
          tools/slint-fork/slint-fork.sh setup
          cargo build --release --manifest-path spikes/d006-slint/Cargo.toml --target-dir spikes/d006-slint/target-fork \
            --config third_party/slint/patch.toml
          cd spikes/d006-slint && cargo tree -p slint --config ../../third_party/slint/patch.toml 2>/dev/null | head -1 | grep -F third_party/slint/src
      # Same layout as the repository, so measure.sh finds the fixture script next to it. Four variants
      # from three binaries: libcosmic default and `--features wgpu` (same target dir, so the default
      # one is staged first), and Slint (default femtovg, and software through SLINT_BACKEND).
      - name: Build libcosmic (default, then wgpu) and stage the bundle
        run: |
          mkdir -p bundle/bin bundle/spikes
          cargo build --release --locked --manifest-path spikes/d006-iced/Cargo.toml
          cp spikes/d006-iced/target/release/d006-iced bundle/bin/d006-iced
          cargo build --release --locked --manifest-path spikes/d006-iced/Cargo.toml --features wgpu
          cp spikes/d006-iced/target/release/d006-iced bundle/bin/d006-iced-wgpu
          cp target/release/budgets spikes/d006-slint/target/release/d006-slint bundle/bin/
          cp spikes/d006-slint/target-fork/release/d006-slint bundle/bin/d006-slint-fork
          cp -r tools/d006 bundle/tools-d006 && mkdir -p bundle/tools && mv bundle/tools-d006 bundle/tools/d006
          cp -r spikes/d006-fixture bundle/spikes/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d006-bundle
          path: bundle
          if-no-files-found: error
          retention-days: 14

  # Hosted x86_64, software rendering: indicative only (docs/budgets.md).
  measure-hosted:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 110  # six variants
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: d006-bundle
          path: bundle
      - run: chmod +x bundle/bin/* bundle/tools/d006/*
      # The package list is also in docs/reference-runner.md (step 7).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sway wtype wl-clipboard grim at-spi2-core \
            gir1.2-atspi-2.0 python3-gi dbus-daemon libgl1-mesa-dri libegl1 fontconfig fonts-dejavu-core mesa-utils mesa-vulkan-drivers
      - name: Measure
        shell: bash
        # A 30 s idle-CPU window keeps the hosted job short; the NUC job uses the full 5 minutes.
        # 7 runs: a first-launch timeout leaves no RSS or CPU reading, and each number needs 5.
        env:
          D006_CPU_WINDOW: "30"
          D006_RUNS: "7"
        run: |
          bundle/tools/d006/measure.sh bundle/bin results
          python3 bundle/tools/d006/summarize.py results | tee -a "$GITHUB_STEP_SUMMARY" >results/summary.md
      # Edge cases of the gate logic on synthetic results (300 vs 301 ms, dropped-frame patterns, missing runs).
      - name: Gate logic tests
        run: python3 bundle/tools/d006/test_gates.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: d006-results-hosted
          path: results/
          if-no-files-found: warn
          retention-days: 14

  # Reference hardware. Runs only if `build` succeeded, so the fork rule above covers it.
  measure-nuc:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.nuc ||
      github.event_name == 'pull_request' && github.event.label.name == 'd006-nuc'
    runs-on: [self-hosted, nuc]
    timeout-minutes: 330  # six variants, 5 runs, full 5-minute idle windows: about 3 h 30 min
    permissions: {}
    steps:
      - name: Clean the workspace
        run: rm -rf bundle results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: d006-bundle
          path: bundle
      - run: chmod +x bundle/bin/* bundle/tools/d006/*
      - name: Check the packages (docs/reference-runner.md, step 7)
        run: |
          for c in sway wtype wl-paste grim dbus-run-session busctl python3 eglinfo; do
            command -v "$c" >/dev/null || { echo "::error::$c is missing on the NUC: owner installs the packages in docs/reference-runner.md step 7"; exit 1; }
          done
          python3 -c 'import gi; gi.require_version("Atspi","2.0")'
          # GPU run: sway needs the render node (option A in docs/reference-runner.md, "GPU measurements").
          [ -r /dev/dri/renderD128 ] && [ -w /dev/dri/renderD128 ] || { echo "::error::runner cannot open /dev/dri/renderD128: owner does option A (docs/reference-runner.md)"; exit 1; }
          for p in libgl1-mesa-dri libegl1 fonts-dejavu-core mesa-utils; do
            dpkg -s "$p" >/dev/null 2>&1 || { echo "::error::package $p is missing on the NUC (docs/reference-runner.md step 7)"; exit 1; }
          done
      - name: Measure
        shell: bash
        # GPU: sway on gles2 and the render node. The summary says "not measured" for any variant whose
        # renderer lines don't show the Intel driver.
        env:
          D006_RENDERER: gles2
        run: |
          bundle/tools/d006/measure.sh bundle/bin results
          python3 bundle/tools/d006/summarize.py results | tee -a "$GITHUB_STEP_SUMMARY" >results/summary.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: d006-results-nuc
          path: results/
          if-no-files-found: warn
          retention-days: 14
