# Budgets on the reference hardware (spec §7): the Intel NUC 11 self-hosted runner.
# Setup: docs/reference-runner.md. Harness: docs/budgets.md.
name: Perf

on:
  # Nightly; scheduled runs always use the default branch (main).
  schedule:
    - cron: "30 1 * * *"
  # On demand: pull requests labelled `perf` (see the `if` on `build`).
  pull_request:
    types: [labeled, synchronize, reopened]

permissions: {}

env:
  # A metric is marked as a regression when it got worse than the previous nightly by more
  # than this percentage of its §7 budget (5 % = 15 ms cold start, 40 MB RSS, 0.05 % CPU).
  # Proposed default, owner to confirm (#17).
  REGRESSION_THRESHOLD_PERCENT: 5

jobs:
  # Nothing compiles on the NUC: build here, measure there.
  build:
    # Never for pull requests from forks: their code must not reach the self-hosted runner.
    # On `labeled`, only the `perf` label itself starts a run.
    if: >-
      github.event_name == 'schedule' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'perf') &&
       (github.event.action != 'labeled' || github.event.label.name == 'perf'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p budgets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-binaries
          path: |
            target/release/budgets
            target/release/budget-test-app
          if-no-files-found: error
          retention-days: 7

  # Runs only if `build` succeeded, so the fork rule above covers this job too.
  measure:
    needs: build
    runs-on: [self-hosted, nuc]
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Clean the workspace
        run: rm -rf bin results && mkdir results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-binaries
          path: bin
      # Artifacts lose the executable bit.
      - run: chmod +x bin/*

      # True cold start needs an empty page cache. Optional: works only with the sudoers
      # rule proposed in docs/reference-runner.md, and says so in the summary otherwise.
      - name: Drop page caches
        id: caches
        run: |
          sync
          if sudo -n /usr/sbin/sysctl -q -w vm.drop_caches=3 2>/dev/null; then
            echo "cold=yes (page caches dropped)" >> "$GITHUB_OUTPUT"
          else
            echo "cold=no (page caches not dropped, see docs/reference-runner.md)" >> "$GITHUB_OUTPUT"
          fi

      - name: Budgets
        timeout-minutes: 10
        # Explicit `bash` adds pipefail, so `tee` does not hide a breach.
        shell: bash
        env:
          COLD: ${{ steps.caches.outputs.cold }}
        run: |
          {
            echo "### Environment"
            echo
            echo "- Runner: $RUNNER_NAME"
            echo "- CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
            echo "- Kernel: $(uname -r)"
            echo "- CPU governor: $(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || echo unknown)"
            echo "- Cold cache: $COLD"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          bin/budgets "$PWD/bin/budget-test-app" --cpu-window full --json results/budget-test-app.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Uploaded on a breach too, so the comparison still runs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: perf-results
          path: results/
          if-no-files-found: warn
          retention-days: 14

  # Compares with the previous nightly on a hosted runner, so the NUC needs no `gh`.
  compare:
    needs: measure
    if: ${{ !cancelled() && needs.measure.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # list earlier runs and download their artifacts
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-binaries
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-results
          path: results
      - name: Compare with the previous nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x bin/budgets
          echo "### Compared with the previous nightly" >> "$GITHUB_STEP_SUMMARY"
          # Newest first; skip this run and nightlies that left no results.
          ids=$(gh run list -R "$GITHUB_REPOSITORY" --workflow perf.yml --event schedule \
            --branch main --limit 20 --json databaseId --jq '.[].databaseId')
          prev=""
          for id in $ids; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n perf-results -D previous 2>/dev/null; then
              prev=$id
              break
            fi
          done
          if [ -z "$prev" ]; then
            echo "No earlier nightly results; nothing to compare." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$prev"
          printf '\nPrevious nightly: [run %s](%s). Threshold: %s %% of each budget.\n\n' \
            "$prev" "$url" "$REGRESSION_THRESHOLD_PERCENT" >> "$GITHUB_STEP_SUMMARY"
          for current in results/*.json; do
            name=$(basename "$current")
            [ -f "previous/$name" ] || { echo "No previous $name" >> "$GITHUB_STEP_SUMMARY"; continue; }
            echo "#### \`$name\`" >> "$GITHUB_STEP_SUMMARY"
            # Exit 1 = regression: marked in the table and as a warning, not a failed job.
            rc=0
            bin/budgets compare "previous/$name" "$current" "$REGRESSION_THRESHOLD_PERCENT" \
              | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
            [ "$rc" -eq 1 ] && echo "::warning title=Perf regression::$name got worse than the previous nightly"
            [ "$rc" -le 1 ] || exit "$rc"
          done
