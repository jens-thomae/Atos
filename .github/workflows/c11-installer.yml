# C11 installer ISO (docs/components/c11-installer/README.md): builds the amd64 installer image and
# the ISO with the published c1-base image as offline payload, checks the ISO's contents, then
# installs it under QEMU with KVM (OVMF Secure Boot firmware in setup mode, swtpm), measures the
# install time and boots the result twice: first boot seals LUKS to PCR7, the second unlocks with it.
# Runs only when installer files change, or by hand (CI minutes, docs/ci.md). Path filtering is
# fine here: this is not a required check. The ISO (about 2 GB) is not uploaded: private-repo
# artifact storage on the Free plan is 500 MB.
name: C11 installer ISO

on:
  pull_request:
    paths:
      - components/c11-installer/**
      - .github/workflows/c11-installer.yml
  push:
    branches: [main]
    paths:
      - components/c11-installer/**
      - .github/workflows/c11-installer.yml
  workflow_dispatch:
    inputs:
      c1-base-ref:
        description: Build the payload from components/c1-base at this git ref instead of pulling the published image
        required: false
        default: ""

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read # the c1-base payload, in case its package is still private
    env:
      PAYLOAD: ghcr.io/jens-thomae/atos/c1-base:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # By hand only: an unpublished c1-base, e.g. one whose trust policy changed (#176 tested #150's).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.c1-base-ref != ''
        with:
          ref: ${{ inputs.c1-base-ref }}
          path: payload-src
          persist-credentials: false
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Pull or build the payload
        env:
          TOKEN: ${{ github.token }}
          REF: ${{ inputs.c1-base-ref }}
        run: |
          if [ -z "$REF" ]; then
            echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
            sudo podman pull -q "$PAYLOAD"
            sudo podman logout ghcr.io
          else
            # Built rootless exactly as c1-base.yml's pull request builds (a rootful build's UKI
            # composefs digest did not match its image), with their layer cache (read only). Tagged
            # as the published image, so the installed system tracks the same reference. No sudo
            # podman login here: it leaves root-owned files in the rootless run directory.
            echo "$TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
            podman build --pull=missing --cache-from ghcr.io/jens-thomae/atos/c1-base-cache --cache-ttl 168h \
              --build-context repo=payload-src -t "$PAYLOAD" payload-src/components/c1-base
            podman logout ghcr.io
            sudo apt-get install -y -q --no-install-recommends sbsigntool > /dev/null
            payload-src/components/c1-base/check-seal.sh "$PAYLOAD"
            # Into root's storage through a compressed OCI layout, like a registry push and pull:
            # loaded from `podman save`, the install ran out of /var/tmp twice (#180).
            podman push -q "$PAYLOAD" "oci:$RUNNER_TEMP/payload:latest"
            podman rmi "$PAYLOAD" >/dev/null
            sudo podman tag "$(sudo podman pull -q "oci:$RUNNER_TEMP/payload:latest")" "$PAYLOAD"
            sudo rm -rf "$RUNNER_TEMP/payload"
            echo "Payload built from \`$REF\` ($(git -C payload-src rev-parse HEAD))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build the ISO
        run: PAYLOAD="$PAYLOAD" OUTDIR="$HOME/c11" components/c11-installer/build-iso.sh
      - name: Check the ISO
        run: |
          sudo apt-get install -y -q --no-install-recommends xorriso > /dev/null
          ls=$(xorriso -indev "$HOME/c11/install.iso" -find / -type f 2>/dev/null)
          for f in /EFI/BOOT/BOOTX64.EFI /EFI/BOOT/grubx64.efi /images/pxeboot/vmlinuz /LiveOS/squashfs.img; do
            grep -qx "'$f'" <<< "$ls" || { echo "missing $f"; exit 1; }
          done
          du -h "$HOME/c11/install.iso"
      - name: Install with KVM, then boot twice
        env:
          TARGET_IMGREF: ${{ env.PAYLOAD }}
        run: |
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf swtpm swtpm-tools python3-virt-firmware > /dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          v=components/c11-installer/vm-test.sh out=components/c11-installer/out
          # §7 budget: install ≤ 10 min, measured from QEMU start (live boot included) to power-off.
          t=$($v install | tee /dev/stderr | sed -n 's/^ATOS-INSTALL-TIME qemu_start_to_poweroff=\([0-9]*\)s$/\1/p')
          echo "Install time under KVM: ${t:?no ATOS-INSTALL-TIME} s (budget 600 s)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$t" -le 600 ] || { echo "::error::install took $t s, over the 600 s budget (spec §7)"; exit 1; }
          # OVMF refuses systemd-boot's PK write, so the TEST keys go into the variables from outside.
          $v enrol
          $v boot
          grep -aq 'Secure Boot: enabled (user)' $out/boot.log
          grep -aq 'bound to the TPM with PCR 7' $out/boot.log
          # #187: the administrator account works with the typed password, and only with it.
          for m in ADMIN-PASSWORD-YESCRYPT ADMIN-SUDO-OK ADMIN-SUDO-WRONG-REFUSED; do grep -aq "ATOS-$m" $out/boot.log; done
          # Flatpak, Flathub and the password login (no autologin) come with c1-base (#187); the published
          # image has them only once that has merged and published, so this check is skipped for older payloads.
          if sudo podman run --rm "$TARGET_IMGREF" rpm -q flatpak >/dev/null; then
            for m in 'FLATPAK-REMOTE flathub' 'FLATPAK-OS-INFO false' TERMINAL-ENTRY LOGIN-READY LOGIN-OK; do grep -aq "ATOS-$m" $out/boot.log; done
            if grep -aq ATOS-LOGIN-AUTOLOGIN-FOUND $out/boot.log; then echo "::error::autologin is still on"; exit 1; fi
          fi
          $v reboot
          grep -aq ATOS-REPORT-END $out/reboot.log
      # The unattended install prints its recovery key to the serial log. It belongs to a throwaway VM
      # disk that exists only on this runner, so printing it publicly is harmless.
      - name: Serial logs
        if: always()
        run: |
          for f in components/c11-installer/out/*.log; do
            echo "== $f: start (firmware, boot loader)"; head -c 6000 "$f" | tr -d '\r' | sed 's/\x1b\[[0-9;?=]*[a-zA-Z]//g'
            echo; echo "== $f: end"; tail -n 200 "$f" | tr -d '\r'
          done || true
