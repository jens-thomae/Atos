name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly run: the idle-CPU budget over its full 5-minute window (spec §7).
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

# A new push to a pull request cancels its older run (saves Actions minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: 0.9.150
  # sha256 of cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz from the GitHub release.
  NEXTEST_SHA256: b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f

jobs:
  # Decides whether the full build is needed. Not `paths-ignore`: a path-filtered workflow
  # leaves a required `rust` check Pending forever. A job skipped by `if` reports Success
  # instead, so docs-only PRs stay mergeable if branch protection is added (docs/ci.md).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: bash tools/ci/test-is-docs-only.sh
      - run: bash tools/ci/test-mirror-base.sh
      - run: bash tools/ci/test-perf-regression-body.sh
      - run: bash tools/dev-push/test.sh
      - id: diff
        shell: bash
        run: |
          # Push to main and the nightly always build. On a PR, HEAD is the merge commit; HEAD^1 is the base.
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # --no-renames: a rename src/a.rs -> docs/a.md must list the old path too.
          code=$(git diff --no-renames --name-only HEAD^1 HEAD | bash tools/ci/is-docs-only.sh)
          # is-docs-only prints true/false for "docs only"; invert to "needs code build".
          [ "$code" = true ] && code=false || code=true
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # ponytail: one job, so the workspace compiles once; split into parallel jobs if it gets slow.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup is preinstalled; this installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-nextest
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o nextest.tar.gz "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NEXTEST_SHA256}  nextest.tar.gz" | sha256sum --check
          tar -xzf nextest.tar.gz -C ~/.cargo/bin
          rm nextest.tar.gz

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run
      # nextest does not run doctests.
      - run: cargo test --doc

      # Quality budgets (spec §7, docs/budgets.md). Fails the job on a breach.
      - name: Budgets
        timeout-minutes: 10
        # Explicit `bash` adds pipefail, so `tee` does not hide a breach.
        shell: bash
        env:
          # `full` is the §7 window (limits::IDLE_CPU_WINDOW_S).
          CPU_WINDOW: ${{ github.event_name == 'schedule' && 'full' || '10' }}
        run: |
          cargo build --release -p budgets
          target/release/budgets target/release/budget-test-app --cpu-window "$CPU_WINDOW" | tee -a "$GITHUB_STEP_SUMMARY"
