# C1 base image (docs/components/c1-base/README.md): a sealed composefs image, UKI and systemd-boot
# signed with the committed TEST Secure Boot key (no secret needed for that, so PRs build it fully).
# Pull requests: build only. Merges to main: build, push to ghcr.io, sign with the CI test key.
# Docs-only changes skip the build (docs/ci.md).
name: C1 base image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PRs: a new push cancels the older run. main: one group per commit, so every run starts. Only the
# publish job serialises (job-level group below), so docs-only runs never queue behind or replace it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jens-thomae/atos/c1-base
  # Layer cache (#86). Written only by the main publish job; pull requests read it and never write.
  # --cache-ttl: cached dnf/rustup layers are reused for at most a week, so Fedora updates still arrive.
  CACHE: ghcr.io/jens-thomae/atos/c1-base-cache-measure
  CACHE_TTL: 168h

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        shell: bash
        # PR: HEAD is the merge commit, HEAD^1 the base. main: squash merges, so HEAD^1 is the previous main.
        # ponytail: a direct multi-commit push to main is judged by its last commit only.
        run: |
          docs=$(git diff --no-renames --name-only HEAD^1 HEAD | bash tools/ci/is-docs-only.sh)
          [ "$docs" = true ] && echo code=false >> "$GITHUB_OUTPUT" || echo code=true >> "$GITHUB_OUTPUT"

  # Pull requests: no registry token, no signing key.
  build:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # packages: read only, to pull the layer cache (#86); a pull request can never push.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to the layer cache (read only)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The compositor build layers (toolchain plus target/) do not fit in the runner's ~14 GB free disk next to the base image.
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: podman build --pull=missing --cache-from "$CACHE" --cache-to "$CACHE" --cache-ttl "$CACHE_TTL" --build-context repo=. -t c1-base components/c1-base
      - name: countme is masked (D-005)
        run: test "$(podman run --rm c1-base systemctl is-enabled rpm-ostree-countme.timer || true)" = masked
      - name: Session is wired (greetd enabled, compositor and Xwayland present)
        run: podman run --rm c1-base sh -c 'test "$(systemctl is-enabled greetd)" = enabled && atos-comp --version && test -x /usr/bin/Xwayland'
      - name: UKI and systemd-boot are signed and seal the image (#54)
        run: |
          sudo apt-get install -y -q --no-install-recommends sbsigntool > /dev/null
          components/c1-base/check-seal.sh c1-base

  publish:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # One publish at a time, never cancelled while pushing; GitHub keeps only the newest waiting one (#109).
    concurrency:
      group: c1-base-main-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail before pushing, so no unsigned image reaches the registry.
      - name: Signing key is set up
        env:
          # An empty COSIGN_PASSWORD is a valid key password for cosign; only the key must exist.
          HAS_KEY: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
        run: |
          [ "$HAS_KEY" = true ] || { echo "::error::COSIGN_PRIVATE_KEY secret missing, see docs/components/c1-base/README.md"; exit 1; }
          [ -f components/c1-base/cosign.pub ] || { echo "::error::components/c1-base/cosign.pub missing"; exit 1; }
          # Content check, not names; the TEST db key is the only private key allowed (D-014: public).
          bash tools/ci/check-no-private-keys.sh

      # The compositor build layers (toolchain plus target/) do not fit in the runner's ~14 GB free disk next to the base image.
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # Layer cache (#86): read and written here only. The login is separate from Push's, which stays as it was.
      - name: Log in to the layer cache
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The label tells users where the corresponding source is (GPL, D-013); the tag is built below.
      - run: podman build --pull=missing --cache-from "$CACHE" --cache-to "$CACHE" --cache-ttl "$CACHE_TTL" --build-context repo=. --label "org.atos.source=$IMAGE:$GITHUB_SHA-source" -t c1-base components/c1-base
      - name: countme is masked (D-005)
        run: test "$(podman run --rm c1-base systemctl is-enabled rpm-ostree-countme.timer || true)" = masked
      - name: UKI and systemd-boot are signed and seal the image (#54)
        run: |
          sudo apt-get install -y -q --no-install-recommends sbsigntool > /dev/null
          components/c1-base/check-seal.sh c1-base

      # Corresponding source (GPL, D-013, #85): the package is public, the repository is not. Built and checked
      # before anything is pushed, and pushed before the image, so no image is ever public without its source. A FROM-scratch
      # image under the sibling tag `<sha>-source`: no extra tooling, and podman/skopeo/cosign treat it like the
      # image (an oras artifact would need a tool the runner lacks). `git archive` ships tracked files only:
      # no .git, no CI credentials (checkout uses persist-credentials: false), nothing untracked.
      - name: Build source bundle
        run: |
          mkdir src
          ID=$(podman image inspect --format '{{.Id}}' c1-base)  # config digest, known before the push
          git archive --prefix="atos-$GITHUB_SHA/" -o "src/atos-$GITHUB_SHA.tar.gz" HEAD
          podman run --rm c1-base rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > src/fedora-packages.txt
          [ -s src/fedora-packages.txt ]
          cat > src/README.md <<EOF
          # Corresponding source of $IMAGE:$GITHUB_SHA (image ID $ID)

          - atos-$GITHUB_SHA.tar.gz: the Atos repository at commit $GITHUB_SHA (atos-comp, Slint-linked code, image recipe).
            Rust dependencies are pinned in the Cargo.lock files and come from crates.io and the git revisions named there.
          - fedora-packages.txt: every Fedora package (NVR) in the image. Their sources are at
            https://src.fedoraproject.org (git, per package and release) and https://koji.fedoraproject.org (source RPMs).
          - Licence: D-013, our own source is MIT OR Apache-2.0; binaries carry the licence of what they link (atos-comp and Slint-linked code: GPL-3.0-only).
          EOF
          printf 'FROM scratch\nLABEL org.atos.source-of="%s:%s" org.atos.source-of-image-id="sha256:%s"\nCOPY . /\n' "$IMAGE" "$GITHUB_SHA" "$ID" > src/Containerfile
          podman build -t c1-base-source src

      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # cosign reads $DOCKER_CONFIG/config.json; podman uses the same file.
          export DOCKER_CONFIG="$RUNNER_TEMP/registry" REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry/config.json"
          printf 'DOCKER_CONFIG=%s\nREGISTRY_AUTH_FILE=%s\n' "$DOCKER_CONFIG" "$REGISTRY_AUTH_FILE" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          echo "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman push --digestfile source-digest c1-base-source "docker://$IMAGE:$GITHUB_SHA-source"
          echo "SRC_DIGEST=$(cat source-digest)" >> "$GITHUB_ENV"
          podman push --digestfile digest c1-base "docker://$IMAGE:$GITHUB_SHA"
          echo "DIGEST=$(cat digest)" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3, cosign v3.1.4

      # Legacy .sig format and no Rekor upload: podman/bootc (containers/image) verify only this
      # format, and only key-based for GitHub identities. Why: docs/components/c1-base/README.md.
      # These flags (and --new-bundle-format on verify) are deprecated in cosign v3: re-check them
      # on every cosign-installer bump.
      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false --tlog-upload=false \
            "$IMAGE@$DIGEST" "$IMAGE@$SRC_DIGEST"

      # `latest` moves only after the signature verifies, and points at that exact manifest:
      # a registry-to-registry copy keeps the manifest bytes, so the digest (and signature) match.
      # It also never moves backwards: it moves only if this commit is ahead of the one `latest` names in its
      # org.atos.source label. Runs are serialised, so this keeps `latest` monotonic (docs-only merges don't matter).
      - name: Verify, then tag latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify --key components/c1-base/cosign.pub --insecure-ignore-tlog --new-bundle-format=false \
            "$IMAGE@$DIGEST" > /dev/null
          cosign verify --key components/c1-base/cosign.pub --insecure-ignore-tlog --new-bundle-format=false \
            "$IMAGE@$SRC_DIGEST" > /dev/null
          # No label (image from before #88, or no latest yet): move it. An API error fails the step, latest stays.
          old=$(skopeo inspect --format '{{index .Labels "org.atos.source"}}' "docker://$IMAGE:latest" || true)
          old=${old##*:}; old=${old%-source}
          if [ -n "$old" ]; then
            st=$(gh api "repos/$GITHUB_REPOSITORY/compare/$old...$GITHUB_SHA" --jq .status)
            case "$st" in ahead|identical) ;; *)
              echo "Pushed and signed \`$IMAGE@$DIGEST\` (tag \`$GITHUB_SHA\`); \`latest\` not moved: it is at $old ($st)" >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            esac
          fi
          skopeo copy "docker://$IMAGE@$DIGEST" "docker://$IMAGE:latest"
          [ "$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:latest")" = "$DIGEST" ]
          echo "Pushed and signed \`$IMAGE@$DIGEST\` (tags \`latest\`, \`$GITHUB_SHA\`); source \`$IMAGE@$SRC_DIGEST\` (tag \`$GITHUB_SHA-source\`)" >> "$GITHUB_STEP_SUMMARY"
