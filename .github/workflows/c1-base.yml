# C1 base image (docs/components/c1-base/README.md): a sealed composefs image, UKI and systemd-boot
# signed with the committed TEST Secure Boot key (no secret needed for that, so PRs build it fully).
# Lanes (docs/ci.md, tools/ci/is-image-change.sh):
#   Pull requests: `build` (build and boot test, no push) only for image changes, or with the label `full-ci`.
#   Merges to main: `publish` (build, push to ghcr.io, sign with the CI test key) for everything in the image.
#   Nightly: `nightly` builds main from scratch and boot tests it, no push; `nightly-report` tracks failures in one issue.
name: C1 base image

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch: # runs the nightly lane; on a branch other than main the report is a dry run

permissions:
  contents: read

# PRs: a new push cancels the older run. main and nightly: one group per event and commit, so every run starts.
# Only the publish job serialises (job-level group below), so other runs never queue behind or replace it.
# Adding any label other than `full-ci` starts a run that skips every job: its own group, so it cancels nothing.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.run_id ||
      github.event_name == 'pull_request' && github.ref ||
      format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jens-thomae/atos/c1-base
  # Layer cache (#86), for pull request builds only. Trust boundary: a same-repo PR can raise its own token to
  # packages: write and push to this cache, so the signed publish job never reads it (no --cache-from there).
  # Publish still writes it, from a from-scratch build, to keep it warm for PRs.
  # --cache-ttl: cached dnf/rustup layers are reused for at most a week, so Fedora updates still arrive.
  CACHE: ghcr.io/jens-thomae/atos/c1-base-cache
  CACHE_TTL: 168h

jobs:
  changes:
    # A labeled event counts only for `full-ci` (as in c3-shell.yml). Nightly runs do not diff.
    if: >-
      (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) ||
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
      publish: ${{ steps.diff.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a push is diffed from github.event.before, which may be several commits back (about 10 MB)
          persist-credentials: false
      - run: bash tools/ci/test-is-image-change.sh && bash tools/ci/test-nightly-issue.sh && bash tools/ci/test-retry.sh
      - id: diff
        shell: bash
        env:
          # `full-ci` forces the PR build, for branches of this repository only.
          FULL_CI: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          # Push: the whole pushed range (a rebase merge pushes several commits). Empty on pull requests.
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        # PR: HEAD^1..HEAD of the merge commit. Push: BEFORE..HEAD; no usable range (new branch, force push) runs every lane.
        run: |
          rc=0; bash tools/ci/changed-paths.sh ${BEFORE:+"$BEFORE"} > "$RUNNER_TEMP/changed" || rc=$?
          [ "$rc" = 0 ] || [ "$rc" = 3 ] || exit "$rc"
          build=$(bash tools/ci/is-image-change.sh pr < "$RUNNER_TEMP/changed")
          publish=$(bash tools/ci/is-image-change.sh publish < "$RUNNER_TEMP/changed")
          [ "$rc" = 3 ] && build=true publish=true
          [ "$FULL_CI" = true ] && build=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then build=false; else publish=false; fi
          printf 'build=%s\npublish=%s\n' "$build" "$publish" >> "$GITHUB_OUTPUT"
          { echo "build: $build, publish: $publish (label full-ci: $FULL_CI; no usable push range: $([ "$rc" = 3 ] && echo yes || echo no))."
            echo 'Changed paths:'; echo '```'; tr '\0' '\n' < "$RUNNER_TEMP/changed"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Pull requests: no registry token, no signing key.
  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # packages: read, to pull the layer cache (#86). Not a boundary: a PR can edit this block. Publish never reads the cache.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Network steps retry transient failures (#246, docs/ci.md): apt with Acquire::Retries, the rest with
      # tools/ci/retry.sh. The runner's packages come first, so a mirror outage fails in a minute, not after the build.
      - &runner-packages
        name: Install runner packages (seal check, boot test)
        run: sudo apt-get -o Acquire::Retries=8 install -y -q --no-install-recommends sbsigntool qemu-system-x86 ovmf python3-virt-firmware socat imagemagick > /dev/null
      - name: Log in to the layer cache (read only)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2016 # the inner shell expands $TOKEN, so it never appears in the retry's arguments
          tools/ci/retry.sh sh -c 'echo "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin'
      # The base pin is our mirror of the recorded quay.io digest, and the mirror holds it (#117). Same login, read only.
      # A bump's copy (base-mirror.yml) starts on the same push, so wait for it up to 10 min.
      - name: Base image is mirrored
        run: for _ in $(seq 20); do bash tools/ci/mirror-base.sh && exit 0; sleep 30; done; exit 1
      # The compositor build layers (toolchain plus target/) do not fit in the runner's ~14 GB free disk next to the base image.
      - &free-disk
        name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # One retry for dnf, curl and the cache inside the build: finished layers come from local storage.
      - run: RETRY_ATTEMPTS=2 tools/ci/retry.sh podman build --pull=missing --cache-from "$CACHE" --cache-ttl "$CACHE_TTL" --build-context repo=. -t c1-base components/c1-base
      # The steps marked &name below also run in `nightly` (YAML aliases), so both lanes check the same things.
      - &countme
        name: countme is masked (D-005)
        run: test "$(podman run --rm c1-base systemctl is-enabled rpm-ostree-countme.timer || true)" = masked
      - &session
        name: Session is wired (greetd enabled, compositor and Xwayland present)
        run: podman run --rm c1-base sh -c 'test "$(systemctl is-enabled greetd)" = enabled && atos-comp --version && test -x /usr/bin/atos-shell && test -x /usr/libexec/atos/atos-session && test -x /usr/bin/Xwayland'
      - &seal
        name: UKI and systemd-boot are signed and seal the image (#54)
        run: components/c1-base/check-seal.sh c1-base
      - &nvidia
        name: NVIDIA driver is signed, matches the kernel and is unmodified (#162)
        run: components/c1-base/nvidia/check.sh c1-base
      - &wireless
        name: Wi-Fi and Bluetooth packages, iwd backend, no connectivity check, unit states (#231)
        run: components/c1-base/check-wireless.sh c1-base
      # #186: install the image, boot it with KVM and Secure Boot, check the dock, the launcher and a shell restart,
      # keep screenshots. Last: it removes the image from podman's storage to make room for the install.
      - &boot
        name: Boot the image, check the dock and the launcher (#186)
        shell: bash  # pipefail: the script's exit code, not tee's, decides the step
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          components/c1-base/shell-boot-test.sh c1-base shell-boot 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - &screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: shell-boot-${{ github.run_attempt }}  # one per attempt: a re-run must not overwrite the failed one (#192)
          path: shell-boot/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # One publish at a time, never cancelled while pushing; GitHub keeps only the newest waiting one (#109).
    concurrency:
      group: c1-base-main-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail before pushing, so no unsigned image reaches the registry.
      - name: Signing key is set up
        env:
          # An empty COSIGN_PASSWORD is a valid key password for cosign; only the key must exist.
          HAS_KEY: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
        run: |
          [ "$HAS_KEY" = true ] || { echo "::error::COSIGN_PRIVATE_KEY secret missing, see docs/components/c1-base/README.md"; exit 1; }
          [ -f components/c1-base/cosign.pub ] || { echo "::error::components/c1-base/cosign.pub missing"; exit 1; }
          # Content check, not names; the TEST db key is the only private key allowed (D-014: public).
          bash tools/ci/check-no-private-keys.sh
      - name: Install runner packages (seal check)
        run: sudo apt-get -o Acquire::Retries=8 install -y -q --no-install-recommends sbsigntool > /dev/null

      # The compositor build layers (toolchain plus target/) do not fit in the runner's ~14 GB free disk next to the base image.
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # Layer cache (#86): write only, never read: every signed image is built from scratch. The login is separate from Push's, which stays as it was.
      - name: Log in to the layer cache
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2016 # the inner shell expands $TOKEN, so it never appears in the retry's arguments
          tools/ci/retry.sh sh -c 'echo "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin'
      # The label tells users where the corresponding source is (GPL, D-013); the tag is built below.
      # The version label is the commit time (UTC), the signed version floor's input (#75, docs/components/c1-base/trust-policy.md).
      # One retry, as in `build`; it also covers the cache push (a cache, not the published image: Push below is not retried).
      - run: >-
          RETRY_ATTEMPTS=2 tools/ci/retry.sh podman build --pull=missing --cache-to "$CACHE" --build-context repo=. --label "org.atos.source=$IMAGE:$GITHUB_SHA-source"
          --label "org.opencontainers.image.version=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d.%H%M%S HEAD)"
          -t c1-base components/c1-base
      - name: countme is masked (D-005)
        run: test "$(podman run --rm c1-base systemctl is-enabled rpm-ostree-countme.timer || true)" = masked
      - name: UKI and systemd-boot are signed and seal the image (#54)
        run: components/c1-base/check-seal.sh c1-base
      - name: NVIDIA driver is signed, matches the kernel and is unmodified (#162)
        run: components/c1-base/nvidia/check.sh c1-base
      - name: Wi-Fi and Bluetooth packages, iwd backend, no connectivity check, unit states (#231)
        run: components/c1-base/check-wireless.sh c1-base

      # Corresponding source (GPL, D-013, #85): the package is public, the repository is not. Built and checked
      # before anything is pushed, and pushed before the image, so no image is ever public without its source. A FROM-scratch
      # image under the sibling tag `<sha>-source`: no extra tooling, and podman/skopeo/cosign treat it like the
      # image (an oras artifact would need a tool the runner lacks). `git archive` ships tracked files only:
      # no .git, no CI credentials (checkout uses persist-credentials: false), nothing untracked.
      - name: Build source bundle
        run: |
          mkdir src
          ID=$(podman image inspect --format '{{.Id}}' c1-base)  # config digest, known before the push
          git archive --prefix="atos-$GITHUB_SHA/" -o "src/atos-$GITHUB_SHA.tar.gz" HEAD
          # NVIDIA's open kernel modules (MIT/GPL-2.0), the exact commit the image's modules are built from (#162).
          (. components/c1-base/nvidia/UPSTREAM
           bash tools/ci/retry.sh git clone -q --depth 1 --branch "$tag" "$repo" "$RUNNER_TEMP/nv"
           test "$(git -C "$RUNNER_TEMP/nv" rev-parse HEAD)" = "$commit"
           git -C "$RUNNER_TEMP/nv" archive --prefix="open-gpu-kernel-modules-$tag/" -o "$PWD/src/open-gpu-kernel-modules-$tag.tar.gz" HEAD)
          podman run --rm c1-base rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > src/fedora-packages.txt
          [ -s src/fedora-packages.txt ]
          cat > src/README.md <<EOF
          # Corresponding source of $IMAGE:$GITHUB_SHA (image ID $ID)

          - atos-$GITHUB_SHA.tar.gz: the Atos repository at commit $GITHUB_SHA (atos-comp, Slint-linked code, image recipe).
            Rust dependencies are pinned in the Cargo.lock files and come from crates.io and the git revisions named there.
          - open-gpu-kernel-modules-*.tar.gz: NVIDIA's open kernel modules at the tag and commit in
            components/c1-base/nvidia/UPSTREAM, built into the image's nvidia*.ko (MIT/GPL-2.0, D-017).
          - fedora-packages.txt: every package (NVR) in the image. Fedora's sources are at
            https://src.fedoraproject.org (git, per package and release) and https://koji.fedoraproject.org (source RPMs);
            the nvidia-* and xorg-x11-drv-nvidia* packages come from RPM Fusion nonfree, sources at https://pkgs.rpmfusion.org.
            NVIDIA's userspace and GSP firmware are binary only, under the NVIDIA Driver License Agreement
            (/usr/share/licenses/xorg-x11-drv-nvidia/LICENSE in the image).
          - Licence: D-013, our own source is MIT OR Apache-2.0; binaries carry the licence of what they link (atos-comp and Slint-linked code: GPL-3.0-only).
          EOF
          printf 'FROM scratch\nLABEL org.atos.source-of="%s:%s" org.atos.source-of-image-id="sha256:%s"\nCOPY . /\n' "$IMAGE" "$GITHUB_SHA" "$ID" > src/Containerfile
          podman build -t c1-base-source src

      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # cosign reads $DOCKER_CONFIG/config.json; podman uses the same file.
          export DOCKER_CONFIG="$RUNNER_TEMP/registry" REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry/config.json"
          printf 'DOCKER_CONFIG=%s\nREGISTRY_AUTH_FILE=%s\n' "$DOCKER_CONFIG" "$REGISTRY_AUTH_FILE" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          echo "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman push --digestfile source-digest c1-base-source "docker://$IMAGE:$GITHUB_SHA-source"
          echo "SRC_DIGEST=$(cat source-digest)" >> "$GITHUB_ENV"
          podman push --digestfile digest c1-base "docker://$IMAGE:$GITHUB_SHA"
          echo "DIGEST=$(cat digest)" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3, cosign v3.1.4

      # Legacy .sig format and no Rekor upload: podman/bootc (containers/image) verify only this
      # format, and only key-based for GitHub identities. Why: docs/components/c1-base/README.md.
      # These flags (and --new-bundle-format on verify) are deprecated in cosign v3: re-check them
      # on every cosign-installer bump.
      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false --tlog-upload=false \
            "$IMAGE@$DIGEST" "$IMAGE@$SRC_DIGEST"

      # `latest` moves only after the signature verifies, and points at that exact manifest:
      # a registry-to-registry copy keeps the manifest bytes, so the digest (and signature) match.
      # It also never moves backwards: it moves only if this commit is ahead of the one `latest` names in its
      # org.atos.source label. Runs are serialised, so this keeps `latest` monotonic (docs-only merges don't matter).
      - name: Verify, then tag latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify --key components/c1-base/cosign.pub --insecure-ignore-tlog --new-bundle-format=false \
            "$IMAGE@$DIGEST" > /dev/null
          cosign verify --key components/c1-base/cosign.pub --insecure-ignore-tlog --new-bundle-format=false \
            "$IMAGE@$SRC_DIGEST" > /dev/null
          # No label (image from before #88, or no latest yet): move it. An API error fails the step, latest stays.
          old=$(skopeo inspect --format '{{index .Labels "org.atos.source"}}' "docker://$IMAGE:latest" || true)
          old=${old##*:}; old=${old%-source}
          if [ -n "$old" ]; then
            st=$(gh api "repos/$GITHUB_REPOSITORY/compare/$old...$GITHUB_SHA" --jq .status)
            case "$st" in ahead|identical) ;; *)
              echo "Pushed and signed \`$IMAGE@$DIGEST\` (tag \`$GITHUB_SHA\`); \`latest\` not moved: it is at $old ($st)" >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            esac
          fi
          skopeo copy "docker://$IMAGE@$DIGEST" "docker://$IMAGE:latest"
          [ "$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:latest")" = "$DIGEST" ]
          echo "Pushed and signed \`$IMAGE@$DIGEST\` (tags \`latest\`, \`$GITHUB_SHA\`); source \`$IMAGE@$SRC_DIGEST\` (tag \`$GITHUB_SHA-source\`)" >> "$GITHUB_STEP_SUMMARY"

  # Nightly (and manual dispatch): main from scratch, as publish builds it (no layer cache), with the PR build's checks
  # and boot test. Pushes nothing, so it needs no registry token (the base mirror is public) and no signing key.
  nightly:
    # Not in forks: their owner's runs and tokens are no concern of this workflow.
    if: github.repository == 'jens-thomae/Atos' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *runner-packages
      - *free-disk
      - run: RETRY_ATTEMPTS=2 tools/ci/retry.sh podman build --pull=missing --build-context repo=. -t c1-base components/c1-base
      - *countme
      - *session
      - *seal
      - *nvidia
      - *wireless
      - *boot
      - *screenshots

  # The only job with issues: write. It runs no build, only tools/ci/nightly-issue.sh.
  nightly-report:
    needs: nightly
    if: ${{ !cancelled() && (needs.nightly.result == 'success' || needs.nightly.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tools/ci/nightly-issue.sh "$RESULT" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          RESULT: ${{ needs.nightly.result }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
