# The user who logs in at greetd's prompt (docs/components/c1-base/README.md, "Session"). The
# installer creates atos with a password and in wheel (#187); this line then does nothing. Only where
# no installer ran (e.g. `bootc install to-disk` in tests) sysusers creates atos, locked: no login.
u atos - "Atos user" /var/home/atos /bin/bash
