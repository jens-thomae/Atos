# Login on tty1, then the compositor (docs/components/c1-base/README.md, "Session"). No autologin
# (owner decision A on #187): the disk unlocks silently through the TPM (D-015), so the user's
# password is what protects the session. agreety asks for user and password and starts the session
# wrapper (atos-comp plus the shell, #186); when the session ends it asks again. A graphical greeter can replace it here (C3/C11).
[terminal]
vt = 1

[default_session]
command = "agreety --cmd /usr/libexec/atos/atos-session"
user = "greetd"
