# Directories the iwd and bluez packages (#231) put in the image's /var. /var is copied only at install, so
# bootc wants tmpfiles.d to own them (bootc container lint, var-tmpfiles). Modes as the packages ship them.
d /var/lib/iwd 0755 root root - -
d /var/lib/ead 0755 root root - -
d /var/lib/bluetooth 0700 root root - -
d /var/lib/bluetooth/mesh 0755 root root - -
