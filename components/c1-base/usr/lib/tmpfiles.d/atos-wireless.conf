# Directories the iwd and bluez packages (#231) put in the image's /var. /var is copied only at install, so
# bootc wants tmpfiles.d to own them (bootc container lint, var-tmpfiles). iwd and ead keep known networks there
# (one file per network): 0700 as their units' StateDirectoryMode, not the RPM's 0755, which tmpfiles would
# re-apply at every boot. bluetooth 0700 as bluez ships it.
d /var/lib/iwd 0700 root root - -
d /var/lib/ead 0700 root root - -
d /var/lib/bluetooth 0700 root root - -
d /var/lib/bluetooth/mesh 0755 root root - -
