# Where the NVIDIA driver saves video memory during suspend (#223, usr/lib/modprobe.d/atos-nvidia.conf).
# systemd does not create it. Fedora's policy labels it systemd_sleep_var_lib_t, the one place
# systemd-sleep may write files; tmpfiles applies that label when it creates the directory.
d /var/lib/systemd/sleep 0700 root root - -
