# Directories the flatpak packages (#187) put in the image's /var. /var is copied only at install, so
# bootc wants tmpfiles.d to own them (bootc container lint, var-tmpfiles). AccountsService comes with
# flatpak's malcontent dependency.
d /var/lib/AccountsService 0775 root root - -
d /var/lib/AccountsService/icons 0775 root root - -
d /var/lib/AccountsService/users 0700 root root - -
d /var/lib/flatpak 0755 root root - -
