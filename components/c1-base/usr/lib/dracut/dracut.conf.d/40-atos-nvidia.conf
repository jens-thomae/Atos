# NVIDIA graphics (D-017, #162; docs/components/c1-base/nvidia.md): neither NVIDIA driver goes into the
# initramfs. The NVIDIA modules change with every driver update, and the UKI stays the same size.
# nouveau stays out too: in the initrd it would bind a Turing-or-newer GPU before NVIDIA's driver
# can (see usr/lib/modprobe.d/atos-nvidia.conf). simpledrm drives the screen until the root is up.
omit_drivers+=" nvidia nvidia-drm nvidia-modeset nvidia-uvm nouveau "
