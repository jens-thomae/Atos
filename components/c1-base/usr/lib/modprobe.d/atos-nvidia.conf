# NVIDIA graphics in one image (D-017, #162; docs/components/c1-base/nvidia.md).
# Both drivers match every NVIDIA GPU. Before nouveau loads, NVIDIA's open modules load and take the
# GPUs they support (Turing and newer). nouveau then binds what is left: older GPUs, and any GPU the
# NVIDIA driver failed on. kmod ignores a failed softdep, so nouveau still loads when nvidia.ko is
# refused or finds no supported GPU.
softdep nouveau pre: nvidia-drm
options nvidia-drm modeset=1 fbdev=1
# Suspend and resume: NVIDIA's README (powermanagement). Driver 615 saves video memory from its
# kernel suspend notifier, inside systemd-sleep (SELinux domain systemd_sleep_t), into an unnamed
# file in this directory. Fedora's policy lets systemd_sleep_t write files only in
# /var/lib/systemd/sleep (systemd_sleep_var_lib_t), not in /var/tmp (tmp_t; #223). On disk, not
# tmpfs; created by usr/lib/tmpfiles.d/atos-nvidia.conf.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/lib/systemd/sleep
