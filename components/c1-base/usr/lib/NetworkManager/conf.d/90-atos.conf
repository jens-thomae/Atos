# Atos (C1, #231; docs/components/c1-base/README.md, "Wi-Fi and Bluetooth").

# Wi-Fi through iwd, not wpa_supplicant (owner decision on #231).
[device]
wifi.backend=iwd

# No connectivity check: it would fetch a URL from a vendor server on every connect and periodically (D-005).
[connectivity]
enabled=false
